<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
<title>PdfCraft PDF — restrained rose glass</title>
<desc>Original PDF letterforms in tinted rose glass, fine directional rim lighting, a shallow refractive edge and a soft contact shadow over deep burgundy. Static SVG rendition for a Web App icon.</desc>
<defs>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#45101d"/><stop offset=".52" stop-color="#290a13"/><stop offset="1" stop-color="#18060d"/></linearGradient>
 <radialGradient id="ambient" cx=".24" cy=".16" r=".88"><stop stop-color="#b83c54" stop-opacity=".2"/><stop offset="1" stop-color="#240710" stop-opacity="0"/></radialGradient>
 <linearGradient id="glass" x1="0" y1="0" x2=".58" y2="1"><stop stop-color="#ffd2d5" stop-opacity=".94"/><stop offset=".32" stop-color="#ff8997" stop-opacity=".91"/><stop offset=".58" stop-color="#f25570" stop-opacity=".86"/><stop offset=".82" stop-color="#e94866" stop-opacity=".94"/><stop offset="1" stop-color="#ff8fa3" stop-opacity=".96"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#fff1f2" stop-opacity=".66"/><stop offset=".28" stop-color="#ffccd5" stop-opacity=".32"/><stop offset=".52" stop-color="#de8399" stop-opacity=".08"/><stop offset=".78" stop-color="#983b54" stop-opacity=".24"/><stop offset="1" stop-color="#ffccd5" stop-opacity=".54"/></linearGradient>
 <linearGradient id="refract" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#ffe3e9" stop-opacity=".58"/><stop offset=".4" stop-color="#ffb7c6" stop-opacity=".14"/><stop offset=".7" stop-color="#9e2247" stop-opacity=".34"/><stop offset="1" stop-color="#ff9ab1" stop-opacity=".37"/></linearGradient>
 <radialGradient id="softGloss" cx=".22" cy=".13" r=".82"><stop stop-color="#fff0f4" stop-opacity=".2"/><stop offset=".33" stop-color="#ffccd9" stop-opacity=".08"/><stop offset=".68" stop-color="#ff9ab1" stop-opacity="0"/><stop offset="1" stop-color="#ff9ab1" stop-opacity="0"/></radialGradient>
 <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe2ec" stop-opacity=".19"/><stop offset="1" stop-color="#ffc3d5" stop-opacity=".02"/></linearGradient>
 <path id="p" fill-rule="evenodd" d="M144 320H252C334 320 376 362 376 435C376 509 333 553 253 553H218V704H144ZM218 389V486H250C285 486 302 469 302 436C302 404 285 389 250 389Z"/>
 <path id="d" fill-rule="evenodd" d="M417 320H509C610 320 663 389 663 512C663 635 610 704 509 704H417ZM491 390V634H507C561 634 587 595 587 512C587 429 561 390 507 390Z"/>
 <path id="f" d="M704 320H884V390H778V481H874V550H778V704H704Z"/>
 <clipPath id="letters"><use xlink:href="#p"/><use xlink:href="#d"/><use xlink:href="#f"/></clipPath>
</defs>
<rect width="1024" height="1024" fill="url(#navy)"/>
<rect width="1024" height="1024" fill="url(#ambient)"/>
<g transform="translate(-2 0)" stroke-linejoin="round">
 <g transform="translate(0 10)" fill="#19040b" stroke="#19040b" stroke-width="11" opacity=".09"><use xlink:href="#p"/><use xlink:href="#d"/><use xlink:href="#f"/></g>
 <g transform="translate(0 6)" fill="#8f2847" stroke="#8f2847" stroke-width="2"><use xlink:href="#p"/><use xlink:href="#d"/><use xlink:href="#f"/></g>
 <g fill="url(#glass)"><use xlink:href="#p"/><use xlink:href="#d"/><use xlink:href="#f"/></g>
 <g clip-path="url(#letters)">
  <g transform="translate(1.6 2.5)" fill="none" stroke="url(#refract)" stroke-width="5"><use xlink:href="#p"/><use xlink:href="#d"/><use xlink:href="#f"/></g>
  <rect x="190" y="250" width="720" height="530" fill="url(#softGloss)"/>
  <g transform="translate(-1 -1.5)" fill="none" stroke="#8f173c" stroke-opacity=".11" stroke-width="3"><use xlink:href="#p"/><use xlink:href="#d"/><use xlink:href="#f"/></g>
 </g>
 <g fill="none" stroke="url(#edge)" stroke-width="1.7"><use xlink:href="#p"/><use xlink:href="#d"/><use xlink:href="#f"/></g>
</g>
</svg>
